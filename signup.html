---
layout: null
---
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
{% include gtm.html %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動報名｜南投縣手工藝發展協會</title>
  <meta name="description" content="社團法人南投縣手工藝發展協會 課程與活動線上報名：填寫姓名、電話與想參加的課程，協會將盡快與您聯繫確認。">
{% include head-assets.html %}
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
  /* 這一頁專用的樣式 */
  /* ---------- Signup form ---------- */
  .signup{background:var(--paper-soft);}
  .signup-form{max-width:640px;display:grid;gap:20px;}
  .signup-form .field{display:grid;gap:8px;}
  .signup-form label{font-weight:700;font-size:15px;color:var(--ink);}
  .signup-form label .req{color:var(--clay);margin-left:4px;}
  .signup-form input,.signup-form select,.signup-form textarea{
    font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);
    border-radius:var(--radius);background:#fff;color:var(--ink);width:100%;}
  .signup-form input:focus,.signup-form select:focus,.signup-form textarea:focus{outline:2px solid var(--yellow);border-color:var(--yellow);}
  .signup-form textarea{min-height:110px;resize:vertical;}
  .signup-form .hp{position:absolute;left:-9999px;}
  .signup-form .note{font-size:13.5px;color:var(--ink-soft);}
  .signup-status{padding:14px 18px;border-radius:var(--radius);font-weight:500;}
  .signup-status.ok{background:var(--green-tint);color:var(--green);}
  .signup-status.err{background:var(--clay-tint);color:var(--clay);}
  .signup-form .btn[disabled]{opacity:.6;cursor:wait;}
  </style>
</head>
<body class="page-contact">
{% include header.html %}
  
    <div class="page-hero">
      <div class="container">
        <h1>活動報名</h1>
      </div>
    </div>
  <main id="main"><section class="signup" id="signup">
    <div class="container">
      <div class="section-head reveal">
        <span class="section-num">線上報名</span>
        <h2>填寫報名資料，我們會盡快與您聯繫</h2>
        <p>送出後協會人員會以電話或 Email 跟您確認上課時間與費用。</p>
      </div>
      <form class="signup-form" id="signupForm" novalidate>
        <div class="field">
          <label for="f-course">想參加的課程／活動<span class="req">*</span></label>
          <select id="f-course" name="course" required>
            <option value="">請選擇</option>
            {% assign open = site.news | where: "signup", true | where_exp: "n", "n.draft != true" | sort: "date" | reverse %}
            {% if open.size > 0 %}<optgroup label="近期開課">{% for n in open %}{% if n.signup_url and n.signup_url != '' %}{% continue %}{% endif %}{% if n.course_code and n.course_code != '' %}{% continue %}{% endif %}
              <option data-end="{{ n.event_end | default: n.event_date | date: '%Y-%m-%d' }}" data-signup-start="{{ n.signup_start | date: '%Y-%m-%d' }}" data-signup-end="{{ n.signup_end | date: '%Y-%m-%d' }}">{{ n.title }}</option>{% endfor %}
            </optgroup>{% endif %}
            <optgroup label="其他想上的課程">
            <option>毛線編織</option>
            <option>禪繞畫</option>
            <option>染布</option>
            <option>錫藝金屬工藝</option>
            <option>複合媒材</option>
            <option>樂齡手工藝</option>
            <option>親子手作工作坊</option>
            <option>其他（請在備註說明）</option>
            </optgroup>
          </select>
        </div>
        <div class="field">
          <label for="f-name">姓名<span class="req">*</span></label>
          <input id="f-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="f-phone">聯絡電話<span class="req">*</span></label>
          <input id="f-phone" name="phone" type="tel" autocomplete="tel" required>
        </div>
        <div class="field">
          <label for="f-email">Email</label>
          <input id="f-email" name="email" type="email" autocomplete="email">
        </div>
        <div class="field">
          <label for="f-people">報名人數</label>
          <input id="f-people" name="people" type="number" min="1" max="50" value="1">
        </div>
        <div class="field">
          <label for="f-note">備註</label>
          <textarea id="f-note" name="note" placeholder="例如：想詢問的問題、可上課的時段"></textarea>
        </div>
        <div class="hp" aria-hidden="true"><label>請勿填寫<input name="website" tabindex="-1" autocomplete="off"></label></div>
        <p class="note">您填寫的資料只用於本次報名聯繫，不會提供給第三方。</p>
        <div><button class="btn btn-primary" type="submit" id="signupBtn">送出報名</button></div>
        <div class="signup-status" id="signupStatus" role="status" hidden></div>
      </form>
    </div>
  </section></main>
{% include footer.html %}
<script>
  // ===== 報名表單 =====
  // 把下面引號裡換成 Google Apps Script「網頁應用程式」網址
  const SIGNUP_URL = 'https://script.google.com/macros/s/AKfycbzMq0X3ElQwXh436YedZhbmJ2PacHVNxN6YV5ZjWit-eKpJ--k8nHTHwDSYkOkje7c1jw/exec';
  const form = document.getElementById('signupForm');
  const statusBox = document.getElementById('signupStatus');
  const submitBtn = document.getElementById('signupBtn');
  function showStatus(msg, ok){ statusBox.textContent = msg; statusBox.className = 'signup-status ' + (ok ? 'ok' : 'err'); statusBox.hidden = false; }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); showStatus('請填寫有 * 號的欄位。', false); return; }
    if (form.website.value) return; // 機器人
    submitBtn.disabled = true; submitBtn.textContent = '送出中…';
    const data = new URLSearchParams(new FormData(form));
    data.append('page', location.href);
    try {
      await fetch(SIGNUP_URL, { method: 'POST', mode: 'no-cors', body: data });
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'signup_submit', form_name: '活動報名', course_name: form.course.value });
      showStatus('報名成功！我們會盡快與您聯繫，謝謝您。', true);
      form.reset();
    } catch (err) {
      showStatus('送出失敗，請稍後再試，或直接來電 0921-399 913。', false);
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = '送出報名';
    }
  });

  // 移除已結束的課程選項，並依網址 ?course= 自動選好課程
  (function(){
    const sel = document.getElementById('f-course');
    const today = new Date(); today.setHours(0,0,0,0);
    sel.querySelectorAll('option[data-end]').forEach(o => { const d=o.dataset.end; if (d && new Date(d+'T23:59:59') < today) o.remove(); });
    sel.querySelectorAll('option[data-signup-end],option[data-signup-start]').forEach(o => { const s=o.dataset.signupStart, e=o.dataset.signupEnd; if ((e && new Date(e+'T23:59:59') < today) || (s && new Date(s+'T00:00:00') > today)) o.remove(); });
    sel.querySelectorAll('optgroup').forEach(g => { if (!g.children.length) g.remove(); });
    const want = new URLSearchParams(location.search).get('course');
    if (want) {
      let opt = [...sel.options].find(o => o.value === want);
      if (!opt) { opt = new Option(want, want); sel.insertBefore(opt, sel.options[1]); }
      sel.value = want;
    }
  })();
</script>
</body>
</html>
