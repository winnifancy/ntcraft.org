# 新的最新消息存檔後，自動填入「發文老師」
name: 自動填入發文老師

on:
  push:
    branches: [main]
    paths:
      - '_news/**'

permissions:
  contents: write
  pages: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 找出發文者並填入
        run: python .github/scripts/fill_author.py "${{ github.event.before }}" "${{ github.sha }}"

      - name: 存回 GitHub
        id: commit
        run: |
          if git diff --quiet; then echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "自動填入發文老師"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: 重新產生網站
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
