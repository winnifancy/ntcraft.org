# Jekyll 設定（GitHub Pages 會自動用它產生網站）
title: 社團法人南投縣手工藝發展協會
timezone: Asia/Taipei
url: https://ntcraft.org
collections:
  news:
    output: true          # 每則消息都有自己的網頁（可分享、GA 可分別統計瀏覽數）
    permalink: /news/:name/
defaults:
  - scope:
      type: news
    values:
      layout: news-post
  # 不放進網站地圖的頁面（預覽頁、舊網址轉址頁、驗證檔）
  - scope: { path: "preview.html" }
    values: { sitemap: false }
  - scope: { path: "social.html" }
    values: { sitemap: false }
  - scope: { path: "mission.html" }
    values: { sitemap: false }
  - scope: { path: "googlee276127f63b789ae.html" }
    values: { sitemap: false }
exclude: [README.md, Gemfile, Gemfile.lock, node_modules, vendor]

# 網站地圖：自動產生 /sitemap.xml（含每則消息），給 Google Search Console
plugins:
  - jekyll-sitemap
