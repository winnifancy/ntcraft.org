<style>
  .share-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);}
  .share-label{font-size:14px;color:var(--ink-soft);margin-right:4px;}
  .share-btn{font:inherit;font-size:14px;line-height:1;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer;}
  .share-btn:hover{border-color:var(--ink);}
  .share-fb{background:#1877F2;border-color:#1877F2;color:#fff;}
  .share-line{background:#06C755;border-color:#06C755;color:#fff;}
  .share-fb:hover,.share-line:hover{filter:brightness(.92);border-color:transparent;}
  .zoomable{cursor:zoom-in;}
  .lightbox{position:fixed;inset:0;z-index:1000;background:rgba(20,18,15,.92);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;}
  .lightbox[hidden]{display:none;}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.4);}
  .lightbox-close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:26px;line-height:44px;cursor:pointer;}
</style>
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="放大圖片"><button type="button" class="lightbox-close" aria-label="關閉">×</button><img alt=""></div>
<script>
  // 點擊消息裡的圖片（海報＋內文圖片）→ 全螢幕放大
  (function(){
    var box = document.getElementById('lightbox'), big = box.querySelector('img'), last = null;
    function close(){ box.hidden = true; big.removeAttribute('src'); document.body.style.overflow = ''; if (last) last.focus(); }
    document.querySelectorAll('.news-detail img').forEach(function(img){
      img.classList.add('zoomable'); img.setAttribute('tabindex', '0');
      function open(){ last = img; big.src = img.currentSrc || img.src; big.alt = img.alt || ''; box.hidden = false; document.body.style.overflow = 'hidden'; box.querySelector('.lightbox-close').focus(); }
      img.addEventListener('click', open);
      img.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });
    box.addEventListener('click', close);
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !box.hidden) close(); });
  })();
  // 分享按鈕：複製連結、手機「更多…」（系統分享選單）
  document.querySelectorAll('.share-row').forEach(function(row){
    var url = row.getAttribute('data-share-url'), title = row.getAttribute('data-share-title');
    var copy = row.querySelector('.share-copy'), more = row.querySelector('.share-native');
    copy.addEventListener('click', function(){
      function done(){ var t = copy.textContent; copy.textContent = '已複製 ✓'; setTimeout(function(){ copy.textContent = t; }, 1800); }
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function(){ window.prompt('請手動複製：', url); });
      else window.prompt('請手動複製：', url);
    });
    if (navigator.share) { more.hidden = false; more.addEventListener('click', function(){ navigator.share({ title: title, url: url }).catch(function(){}); }); }
  });
</script>
