# Pages CMS 後台設定（https://app.pagescms.org）
settings:
  commit:
    identity: user
    templates:
      create: "Create {path} (via Pages CMS) by {userEmail}"
      update: "Update {path} (via Pages CMS) by {userEmail}"
      delete: "Delete {path} (via Pages CMS) by {userEmail}"
      rename: "Rename {oldPath} to {newPath} (via Pages CMS) by {userEmail}"

media:
  input: assets/images/news
  output: /assets/images/news
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: news
    label: 最新消息／課程
    type: collection
    path: _news
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    format: yaml-frontmatter
    view:
      fields: [title, author, category, date, draft]
      search: [title, author]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 標題（課程或活動名稱）
        type: string
        required: true
      - name: category
        label: 類別
        type: select
        default: 課程
        options:
          values: [課程, 活動, 公告]
      - name: date
        label: 發布日期（決定排列順序，新的在前）
        type: date
        options:
          format: yyyy-MM-dd
      - name: event_date
        label: 上課／活動日期（公告可留空）
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: event_end
        label: 結束日期（只有一天可留空）
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: event_time
        label: 時間（例如：每週三 14:00–16:00）
        type: string
      - name: location
        label: 地點
        type: string
      - name: fee
        label: 費用（例如：免費、800 元含材料）
        type: string
      - name: poster
        label: 海報或照片
        type: image
      - name: summary
        label: 簡短介紹（顯示在卡片上，1～2 句）
        type: text
      - name: signup
        label: 開放報名（打勾會出現報名按鈕；有填外部報名網址就連到外部）
        type: boolean
        default: true
      - name: course_code
        label: 職訓局課程代碼（例如 174414；填了會自動連到職訓局報名頁）
        type: string
      - name: signup_url
        label: 外部報名網址（非職訓局的外部報名才需要填；有填會優先使用）
        type: string
      - name: signup_label
        label: 外部報名按鈕文字（留空＝「報名/簡章下載」）
        type: string
      - name: signup_start
        label: 報名開始日（留空＝現在就開放）
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: signup_end
        label: 報名截止日（過了這天按鈕會變「報名已截止」）
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: author
        label: 發文老師（第一次存檔後系統自動填入，不用填）
        type: string
        readonly: true
      - name: draft
        label: 存成草稿（打勾＝只在預覽頁 ntcraft.org/preview.html 看得到，正式網站不顯示）
        type: boolean
        default: false
      - name: body
        label: 詳細內容
        type: rich-text

  - name: teachers
    label: 老師名單（Email 對應姓名）
    type: file
    path: _data/teachers.yml
    format: yaml
    list: true
    fields:
      - name: email
        label: 登入用的 Email
        type: string
        required: true
      - name: name
        label: 顯示的老師姓名
        type: string
        required: true

  - name: site
    label: 網站設定（選單、頁首按鈕、頁尾）
    type: file
    path: _data/site.yml
    format: yaml
    fields:
      - name: nav
        label: 上方選單（可調整順序、新增或刪除；網址以 / 開頭，例如 /news.html；首頁用 /）
        type: object
        list: true
        fields:
          - name: label
            label: 選單文字
            type: string
            required: true
          - name: url
            label: 連結網址
            type: string
            required: true
      - name: cta_label
        label: 頁首紅色按鈕文字（按鈕會自動連到最新一則可報名課程）
        type: string
      - name: facebook
        label: Facebook 粉絲專頁網址
        type: string
      - name: official_notice
        label: 頁首下方的官方網站說明列
        type: string
      - name: address
        label: 頁尾地址
        type: string
      - name: phone
        label: 頁尾電話
        type: string
      - name: legal
        label: 頁尾立案資料（第一行）
        type: string
      - name: legal_2
        label: 頁尾說明（第二行）
        type: string
